name: Deploy verified invoice generator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-verified-build.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: invoice-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download verified production build
        env:
          BUILD_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-c4a8-81f7-bc2e-daba5a407b4f/raw?se=2026-11-23T14%3A05%3A28Z&sp=r&sv=2026-06-06&sr=b&scid=05e1ca4e-5b84-4e5b-9d93-843e10be65c2&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T16%3A01%3A31Z&ske=2026-11-23T16%3A01%3A31Z&sks=b&skv=2026-06-06&sig=mKKy7jzMH0PTsoiS8UcHP/0Lq4/UGcionocu0KCea7Y%3D'
        run: |
          curl --fail --location "$BUILD_URL" --output build.zip
          mkdir site
          unzip -q build.zip -d site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
