name: Publish verified invoice generator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-verified-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invoice-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public page
        uses: actions/checkout@v4

      - name: Download and verify production build
        env:
          BUILD_URL: 'https://sdmntpreastus3.oaiusercontent.com/files/00000000-aca8-8212-8acf-2d90ad6a8fea/raw?se=2026-11-23T14%3A12%3A59Z&sp=r&sv=2026-06-06&sr=b&scid=312f11be-b736-4032-9c27-5befc01a393b&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-23T13%3A06%3A23Z&ske=2026-11-24T13%3A06%3A23Z&sks=b&skv=2026-06-06&sig=7NkcLvVrliaaxzqGjh66btxF6eSJIjzir%2BgUn2SUfUc%3D'
        run: |
          curl --fail --location "$BUILD_URL" --output build.zip
          echo "68aa99ac39fbc20a0dad9f3efa8618e54e25a80182d628b6b0388a7b7991b41b  build.zip" | sha256sum --check
          mkdir site
          unzip -q build.zip -d site

      - name: Copy verified files
        run: |
          cp -R site/. .
          touch .nojekyll

      - name: Publish updated page
        run: |
          git config user.name serviceameli
          git config user.email service.ameli.aniri@gmail.com
          git add index.html assets .nojekyll
          git diff --cached --quiet || git commit -m "Publish Martynova Sberbank account"
          git push
